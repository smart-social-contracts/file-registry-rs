[package]
name = "file_registry"
version = "0.1.0"
edition = "2021"
description = "Cycle-efficient file registry canister for Realms, built on ic-certified-assets. Drop-in replacement for the Python file_registry."
repository = "https://github.com/smart-social-contracts/file-registry-rs"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.19"
ic-certified-assets = { git = "https://github.com/smart-social-contracts/certified-assets.git", rev = "b666a964263d76104e0c8d5c30102cb436994034" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
serde_cbor = "0.11"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
