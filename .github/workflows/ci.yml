name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install ic-wasm
        run: |
          curl -L "https://github.com/dfinity/ic-wasm/releases/latest/download/ic-wasm-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin ic-wasm || cargo install ic-wasm
          ic-wasm --version
      - name: Build canister WASM
        run: bash scripts/build.sh
      - name: Report WASM hash
        run: sha256sum out/file_registry.wasm.gz
      - uses: actions/upload-artifact@v4
        with:
          name: file_registry-wasm
          path: out/file_registry.wasm.gz
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/file_registry.wasm.gz
